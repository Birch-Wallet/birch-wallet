name: Reproducible Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  reproducibility:
    name: Verify build reproducibility
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pin Xcode version
        run: |
          XCODE_VERSION=$(cat .xcode-version)
          # The xcode-27 image installs some releases under a _beta name
          # (Xcode_27.1_beta.app holds the 27.1 release build), so try both.
          for APP in "/Applications/Xcode_${XCODE_VERSION}.app" "/Applications/Xcode_${XCODE_VERSION}_beta.app"; do
            if [ -d "$APP" ]; then
              sudo xcode-select -s "$APP/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          # Fail rather than build with whatever Xcode the image defaults to.
          if ! xcodebuild -version | head -1 | grep -qx "Xcode ${XCODE_VERSION}"; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner"
            exit 1
          fi

      - name: Build 1
        run: |
          DERIVED_DATA="/tmp/birch-build-1"
          rm -rf "$DERIVED_DATA"
          xcodebuild archive \
            -scheme birch \
            -project birch.xcodeproj \
            -archivePath "$DERIVED_DATA/birch.xcarchive" \
            -derivedDataPath "$DERIVED_DATA" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Build 2
        run: |
          DERIVED_DATA="/tmp/birch-build-2"
          rm -rf "$DERIVED_DATA"
          xcodebuild archive \
            -scheme birch \
            -project birch.xcodeproj \
            -archivePath "$DERIVED_DATA/birch.xcarchive" \
            -derivedDataPath "$DERIVED_DATA" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Normalize both builds
        run: |
          APP1="/tmp/birch-build-1/birch.xcarchive/Products/Applications/birch.app"
          APP2="/tmp/birch-build-2/birch.xcarchive/Products/Applications/birch.app"
          ./scripts/normalize-app.sh "$APP1"
          ./scripts/normalize-app.sh "$APP2"

      - name: Compare builds
        run: |
          APP1="/tmp/birch-build-1/birch.xcarchive/Products/Applications/birch.app"
          APP2="/tmp/birch-build-2/birch.xcarchive/Products/Applications/birch.app"
          ./scripts/compare-builds.sh "$APP1" "$APP2"
