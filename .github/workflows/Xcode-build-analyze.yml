name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pin Xcode version
        run: |
          XCODE_VERSION=$(cat .xcode-version)
          # The xcode-27 image installs some releases under a _beta name
          # (Xcode_27.1_beta.app holds the 27.1 release build), so try both.
          for APP in "/Applications/Xcode_${XCODE_VERSION}.app" "/Applications/Xcode_${XCODE_VERSION}_beta.app"; do
            if [ -d "$APP" ]; then
              sudo xcode-select -s "$APP/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          # Fail rather than build with whatever Xcode the image defaults to.
          if ! xcodebuild -version | head -1 | grep -qx "Xcode ${XCODE_VERSION}"; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner"
            exit 1
          fi

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project birch.xcodeproj -scheme birch

      - name: Validate Package.resolved
        run: |
          if ! git diff --quiet birch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::error::Package.resolved has uncommitted changes after resolution. Commit the updated Package.resolved."
            git diff birch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            exit 1
          fi

      - name: Build
        env:
          scheme: birch
          file_to_build: birch.xcodeproj
          filetype_parameter: project
        run: |
          xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}
