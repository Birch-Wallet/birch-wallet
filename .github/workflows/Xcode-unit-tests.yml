name: Xcode - Unit Tests

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run unit tests using xcodebuild
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pin Xcode version
        run: |
          XCODE_VERSION=$(cat .xcode-version)
          # The xcode-27 image has installed some releases only under a _beta
          # name (Xcode_<version>_beta.app), so try that too.
          for APP in "/Applications/Xcode_${XCODE_VERSION}.app" "/Applications/Xcode_${XCODE_VERSION}_beta.app"; do
            if [ -d "$APP" ]; then
              sudo xcode-select -s "$APP/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          # Fail rather than build with whatever Xcode the image defaults to.
          if ! xcodebuild -version | head -1 | grep -qx "Xcode ${XCODE_VERSION}"; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner"
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          xcodebuild test -project birch.xcodeproj -scheme birch -destination 'platform=iOS Simulator,name=iPhone 18 Pro' -only-testing:birchTests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}
